worker_processes  auto;
error_log  /var/log/nginx/error-server.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    # gzip on;

    log_format  main '$remote_addr - $remote_user [$time_local] "$request" $status '
                 '$body_bytes_sent "$http_referer" "$http_user_agent" $request_length '
                 '$request_time $upstream_addr $upstream_response_length $upstream_response_time $upstream_status';

    access_log  /var/log/nginx/access-server.log main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}