image: node:18

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - smart-contract-form/dist
    expire_in: 1 day
  only:
    - main
    - master

pages:
  stage: deploy
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r smart-contract-form/dist/* public/
  artifacts:
    paths:
      - public
  only:
    - main
    - master
